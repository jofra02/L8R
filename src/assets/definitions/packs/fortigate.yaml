# Enrichment pack: FortiGate (FortiOS) — deterministic, read-only.
#
# Tool names are LITERAL and pinned against mcp_gateway/baseline_tools.txt
# (name-freeze). The device routing key is the asset ref, injected by the
# engine as args["device"] — never part of the tool name.
# Versioned and immutable once synced; bump version to change.
# v2: no semantic change — the schema dropped the `produces` field (replaced
# by `subitems`), and content_hash covers the canonical dump, so the v1
# file (which carried `produces: []`) would no longer hash-match its
# stored snapshot. Bumping keeps the immutability contract intact.
# v3: license step normalizer -> fortigate.license_status (same envelope +
# `normalized` license entries); new attributes.licenses mapping. The raw
# blob mapping (attributes.license_status) is unchanged.
# v4: managed FortiAPs (WLC) and FortiSwitches (Switch Controller) as
# subitems (kinds access_point/switch). Purely additive: two new optional
# steps + two root-level subitems rules; no existing mapping changed.
# Both tools hit /api/v2/monitor despite the cmdb_ name prefix (spec
# directory artifact — names are frozen, copied literally). Endpoints are
# unpaginated, so the absence sweep always runs.
pack_id: fortigate
version: 4
label: FortiGate (FortiOS)
compatible:
  device_types: [fortios]
  asset_types: [firewall]

steps:
  - id: system_status
    tool: fgt74_monitor_sys_get_status
    required: true
    normalizer: fortigate.monitor_results
    timeout_s: 30
  - id: license
    tool: fgt74_monitor_lic_get_license_status
    normalizer: fortigate.license_status
  - id: firmware
    tool: fgt74_monitor_sys_get_firmware
    normalizer: fortigate.monitor_results
  - id: perf
    tool: fgt74_monitor_sys_get_performance_status
    normalizer: fortigate.monitor_results
  - id: interfaces
    tool: fgt74_cmdb_sys_get_interface
    normalizer: fortigate.cmdb_results
  - id: ha
    tool: fgt74_cmdb_sys_get_ha
    normalizer: fortigate.cmdb_results
    sanitize: [password, key]
  - id: vdoms
    tool: fgt74_cmdb_sys_get_vdom
    normalizer: fortigate.cmdb_results
  - id: lldp
    tool: fgt74_monitor_net_get_network_lldp_neighbors
    normalizer: fortigate.monitor_results
  # Optional: a FortiGate without WiFi/switch-controller config returns an
  # error here; required:false keeps the run alive for those devices.
  - id: managed_aps
    tool: fgt74_cmdb_wifi_get_managed_ap
    normalizer: fortigate.monitor_results
  - id: managed_switches
    tool: fgt74_cmdb_switch_get_controller_managed_status
    normalizer: fortigate.monitor_results

# Self-enrichment: dotted paths into the normalized step output
# ({results, meta}). Default policy manual_wins: a manually-set field is
# never overwritten by discovery.
mappings:
  - { source: system_status.meta.serial,        target: serial_number, policy: discovered_wins }
  - { source: system_status.results.hostname,   target: name }
  - { source: system_status.results.model,      target: model }
  - { source: system_status.meta.version,       target: attributes.os_version, policy: discovered_wins }
  - { source: license.results,                  target: attributes.license_status, policy: discovered_wins }
  - { source: license.normalized,               target: attributes.licenses, policy: discovered_wins }
  - { source: firmware.results,                 target: attributes.firmware, policy: discovered_wins }
  - { source: perf.results,                     target: attributes.performance, policy: discovered_wins }
  - { source: interfaces.results,               target: attributes.interfaces, policy: discovered_wins }
  - { source: ha.results,                       target: attributes.ha_config, policy: discovered_wins }
  - { source: vdoms.results,                    target: attributes.vdoms, policy: discovered_wins }

# Discovery: managed FortiAPs and FortiSwitches land in asset_subitems,
# never in assets (curated-vs-discovered invariant). State is stored raw
# (no state_map), matching the fortiedr pack.
subitems:
  # Field paths verified live against FortiOS 7.2.12 (druidics, 2 FAPs):
  # `status` is the connection state (connected/disconnected); `state` is
  # the authorization state. os_version/board_mac/join_time only populate
  # for connected APs — misses are silently omitted by design.
  - step: managed_aps
    items: "results[*]"
    kind: access_point
    identity: { source: fortigate, external_id: serial, fallback: name }
    name: name
    state: status
    attributes:
      - { source: os_version,      target: attributes.os_version }
      - { source: board_mac,       target: attributes.mac }
      - { source: local_ipv4_addr, target: attributes.ip }
      - { source: ap_profile,      target: attributes.ap_profile }
      - { source: clients,         target: attributes.client_count }
      - { source: eos,             target: attributes.eos }
      - { source: join_time_raw,   target: attributes.joined_at, transform: to_datetime }
  - step: managed_switches
    items: "results[*]"
    kind: switch
    identity: { source: fortigate, external_id: serial, fallback: name }
    name: name
    state: status
    attributes:
      - { source: os_version,         target: attributes.os_version }
      - { source: connecting_from,    target: attributes.ip }
      - { source: fgt_peer_intf_name, target: attributes.uplink_interface }
      - { source: model,              target: attributes.model }

# Match-only: relations link to EXISTING assets (by MAC), no asset
# creation from LLDP neighbors.
relations:
  - step: lldp
    items: "results[*]"
    type: connected_to
    match: { path: chassis_id, by: attributes.mac }
