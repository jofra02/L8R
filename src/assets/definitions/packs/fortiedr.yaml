# Enrichment pack: FortiEDR management console — deterministic, read-only.
#
# One console asset produces MANY child endpoint assets (collectors),
# upserted by (customer_id, external_source, external_id). Absent children
# are never deleted — retirement is a human decision.
pack_id: fortiedr
version: 1
label: FortiEDR
compatible:
  device_types: [fortiedr]
  asset_types: [edr_console]

steps:
  - id: summary
    tool: fedr62_mgmt_administrator_get_admin_list_system_summary
    required: true
    normalizer: fortiedr.results
  - id: collectors
    tool: fedr62_mgmt_system_inventory_get_list_collectors
    normalizer: fortiedr.results
    paginate:
      page_param: pageNumber
      size_param: itemsPerPage
      size: 200
      max_pages: 50
      start_page: 0

# Console self-enrichment.
mappings:
  - { source: summary.results.serialNumber,           target: serial_number, policy: discovered_wins }
  - { source: summary.results.managementHostname,     target: fqdn }
  - { source: summary.results.managementVersion,      target: attributes.management_version, policy: discovered_wins }
  - { source: summary.results.licenseType,            target: attributes.license_type, policy: discovered_wins }
  - { source: summary.results.licenseExpirationDate,  target: attributes.license_expiration, policy: discovered_wins, transform: to_datetime }

relations: []

# Child endpoint assets from the collectors inventory. Mapping sources are
# paths INSIDE each item.
produces:
  - step: collectors
    items: "results[*]"
    asset_type: endpoint
    identity:
      external_source: fortiedr
      external_id: id
      fallback: "macAddresses[0]"
    relation: { type: managed_by }
    mappings:
      - { source: name,               target: name, policy: discovered_wins }
      - { source: ipAddress,          target: ip_address, policy: discovered_wins }
      - { source: operatingSystem,    target: attributes.os, policy: discovered_wins }
      - { source: osFamily,           target: attributes.os_family, policy: discovered_wins }
      - { source: state,              target: attributes.edr_state, policy: discovered_wins }
      - { source: version,            target: attributes.edr_version, policy: discovered_wins }
      - { source: collectorGroupName, target: attributes.edr_group, policy: discovered_wins }
      - { source: macAddresses,       target: attributes.mac, policy: discovered_wins, transform: first }
      - { source: loggedUsers,        target: attributes.logged_users, policy: discovered_wins }
      - { source: lastSeenTime,       target: attributes.last_seen_at, policy: discovered_wins, transform: to_datetime }
