# EDR management console (e.g. FortiEDR manager). Discovered endpoints
# land in asset_subitems attached to the console.
# v2: + licenses (normalized) + license_features.
type_id: edr_console
version: 2
label: EDR Console
category: security
roles: []
fields:
  - key: management_version
    label: Management version
    type: string
    filterable: true
  - key: license_type
    label: License type
    type: string
    filterable: true
  - key: license_expiration
    label: License expiration
    type: datetime
  - key: license_capacity
    label: License capacity
    type: json
  - key: license_features
    label: License features
    type: string_list
    filterable: true
  - key: licenses
    label: Licenses (normalized)
    type: json
  - key: components
    label: System components
    type: json
relations:
  allowed: [depends_on, connected_to, managed_by]
