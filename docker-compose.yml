x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-change_me}
      POSTGRES_DB: ${DB_NAME:-support_agent_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - support-ai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.14.0
    <<: *restart
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - support-ai
    healthcheck:
      # The qdrant image ships neither wget nor curl; probe via bash /dev/tcp
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 3s
      retries: 5

  mcp-gateway:
    build: ./mcp_gateway
    <<: *restart
    environment:
      # Multi-tenant: the app sends the tenant per request. DEFAULT_TENANT is an
      # optional fallback for header-less calls (manual curl / single-tenant).
      DEFAULT_TENANT: ${DEFAULT_TENANT:-}
      INVENTORY_MASTER_KEY: ${INVENTORY_MASTER_KEY:-}
      INVENTORY_ROOT: /app/inventory
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-}
      SERVER_PORT: 8000
      SERVER_TRANSPORT: sse
      LOG_LEVEL: ${MCP_GATEWAY_LOG_LEVEL:-info}
      # The gateway has no env_file: only these entries reach the container.
      # Per-pack manifests may override via http_timeout/http_connect_timeout.
      GATEWAY_HTTP_TIMEOUT: ${GATEWAY_HTTP_TIMEOUT:-30}
      GATEWAY_HTTP_CONNECT_TIMEOUT: ${GATEWAY_HTTP_CONNECT_TIMEOUT:-5}
    ports:
      - "${MCP_GATEWAY_PORT:-8001}:8000"
    volumes:
      # Read-write: the admin API persists devices/managed.yaml here
      - ./mcp_gateway/inventory:/app/inventory
    networks:
      - support-ai
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sse/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  app:
    build: .
    <<: *restart
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
    env_file: .env
    environment:
      # Override hosts to Docker service names
      DB_HOST: postgres
      QDRANT_URL: http://qdrant:6333
      LANGFUSE_HOST: http://langfuse:3000
      MCP_GATEWAY_URL: http://mcp-gateway:8000/sse
      MCP_GATEWAY_ADMIN_URL: http://mcp-gateway:8000
      MCP_GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - evidence_data:/app/data/evidence
      # Read-only: lets `docker compose exec app python src/main.py register-tenant ...`
      # find the tenant YAMLs (data/tenants/ is excluded from the image by .dockerignore)
      - ./data/tenants:/app/data/tenants:ro
    networks:
      - support-ai
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Covers Alembic migrations in the entrypoint (tool indexing runs in background)
      start_period: 120s

  frontend:
    build: ./frontend
    <<: *restart
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3001}:80"
    networks:
      - support-ai
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

  langfuse:
    image: langfuse/langfuse:2
    <<: *restart
    profiles: [observability]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASS:-change_me}@postgres:5432/${LANGFUSE_DB:-langfuse}
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme-generate-a-secret}
      SALT: ${LANGFUSE_SALT:-changeme-generate-a-salt}
    ports:
      - "${LANGFUSE_PORT:-3000}:3000"
    networks:
      - support-ai

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    <<: *restart
    profiles: [tunnel]
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - support-ai

volumes:
  pgdata:
  qdrant_data:
  evidence_data:

networks:
  support-ai:
    driver: bridge
