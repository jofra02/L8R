# Tool Category Taxonomy — Single source of truth
# Consumed by src/core/tool_categories.py and any pipeline that needs IT domain categories.

categories:
  # Network — Layer 2/3 Infrastructure
  routing: "BGP, OSPF, EIGRP, IS-IS, static routes, route tables, VRFs, PBR"
  switching: "VLANs, STP/RSTP/MSTP, port-channels/LACP, MAC tables, L2 forwarding"
  network_interfaces: "Physical/logical interface status, speed/duplex, errors/counters, MTU"
  arp_mac: "ARP tables, MAC address tables, MAC-to-IP resolution, ARP inspection"
  qos: "Traffic shaping, policing, DSCP marking, queue management, bandwidth guarantees"
  multicast: "IGMP, PIM, multicast routing, multicast groups, RP configuration"
  mpls: "Label switching, LSPs, LDP, MPLS VPN, traffic engineering"
  network_fabric: "Cisco ACI, VMware NSX, VXLAN, EVPN, overlay networks"
  spanning_tree: "STP topology, root bridge, port roles/states, BPDU guard, loop prevention"

  # Network — WAN & Connectivity
  sd_wan: "Overlay tunnels, WAN policies, application-aware routing, SLA probes, path selection"
  wan_optimization: "WAN accelerators, deduplication, compression, latency reduction"
  mpls_vpn: "MPLS L3VPN, L2VPN, pseudowires, CE-PE connectivity, VRF leaking"
  isp_circuits: "WAN links, circuit IDs, bandwidth, SLA, carrier management"
  bgp_peering: "BGP neighbors, prefix advertisements, AS-path, communities, route policies"

  # Network — Services
  dns: "Name resolution, DNS zones, records, DNSSEC, split-horizon, forwarding"
  dhcp: "Scopes, leases, reservations, relay agents, DHCP failover"
  ipam: "IP address management, subnet allocation, IP planning, conflict detection"
  ntp: "Time synchronization, NTP servers/peers, stratum, clock drift"
  proxy: "Forward proxy, web filtering, content inspection, URL categorization"

  # Network — Wireless
  wireless: "Access points, SSIDs, RF management, wireless controllers, roaming"
  wireless_security: "WPA2/WPA3, 802.1X wireless, rogue AP detection, captive portals"

  # Firewall & Perimeter
  firewall: "Security policies/rules, ACLs, zones, packet filtering, rule ordering"
  nat: "Source NAT, destination NAT, PAT, NAT pools, NAT traversal"
  firewall_objects: "Address objects, service objects, object groups, FQDN objects"
  firewall_ha: "Active/passive, active/active, failover, cluster sync, session sync"
  waf: "Web application firewall rules, OWASP protection, bot mitigation"
  ddos_protection: "DDoS mitigation, rate limiting, scrubbing, traffic anomaly detection"

  # Security
  vpn: "IPSec tunnels, SSL VPN, remote access, tunnel status, phase1/phase2 SAs"
  authentication: "RADIUS, TACACS+, LDAP, SAML, SSO, MFA, 802.1X, auth policies"
  nac: "Network Access Control, 802.1X wired, posture assessment, device profiling"
  certificates: "PKI, TLS/SSL certs, CA management, cert lifecycle, OCSP/CRL"
  ids_ips: "Intrusion detection/prevention, signatures, anomaly detection, threat events"
  network_security: "Security monitoring, threat intelligence, IOC correlation"
  endpoint_protection: "Antivirus, EDR, endpoint firewall, malware detection"
  email_security: "Antispam, DMARC/DKIM/SPF, email gateway, phishing protection"
  dlp: "Data loss prevention, content inspection, sensitive data detection"
  siem: "Security event management, log correlation, security analytics, SOAR"
  vulnerability_scanning: "Vulnerability assessment, CVE detection, patch gaps"
  microsegmentation: "Zero trust segmentation, workload isolation, east-west policies"
  encryption: "Disk encryption, data-at-rest/transit, key management, KMS, HSM"
  casb: "Cloud access security broker, shadow IT detection, cloud app control"

  # Compute & Virtualization
  hypervisor: "ESXi, Hyper-V, KVM, Proxmox — VM lifecycle, snapshots, resource pools"
  virtual_machines: "VM creation, cloning, templates, snapshots, resource allocation"
  containers: "Docker, Podman, container images, registries, container lifecycle"
  container_orchestration: "Kubernetes, OpenShift, K3s — pods, deployments, services, namespaces"
  server_hardware: "BIOS/UEFI, firmware, iLO/iDRAC/IPMI, hardware health"
  vdi: "Virtual desktop infrastructure, Horizon, Citrix, RDS, desktop pools"
  compute_cluster: "HA clusters, DRS, affinity rules, resource scheduling, failover"
  gpu_compute: "GPU passthrough, vGPU, NVIDIA GRID, AI/ML compute resources"

  # Storage
  storage_san: "Fibre Channel, iSCSI, FCoE, LUNs, zoning, HBAs, multipathing"
  storage_nas: "NFS, SMB/CIFS, file shares, quotas, permissions, export policies"
  vsan: "VMware vSAN, storage policies, disk groups, fault domains"
  storage_pools: "RAID groups, aggregates, tiering, thin/thick provisioning, dedup"
  storage_replication: "Synchronous/async replication, SRM, mirroring, RPO"
  backup_recovery: "Backup jobs, restore, Veeam, Commvault, retention policies"
  disaster_recovery: "DR plans, failover/failback, DR testing, RTO/RPO compliance"
  storage_performance: "IOPS, latency, throughput, cache hit ratio, queue depth"
  object_storage: "S3-compatible, MinIO, blob storage, buckets, object lifecycle"

  # Hyperconverged Infrastructure
  hci: "Nutanix, Azure Stack HCI, VxRail — converged compute+storage+network"
  hci_storage: "Nutanix storage containers, replication factor, EC, dedup on HCI"
  hci_networking: "HCI network segmentation, AHV networking, uplink configuration"

  # Cloud & Hybrid
  cloud_iaas: "AWS EC2, Azure VMs, GCP Compute — cloud instances, cloud networking"
  cloud_networking: "VPCs, subnets, peering, transit gateways, cloud load balancers"
  cloud_identity: "Azure AD/Entra ID, AWS IAM, GCP IAM, cloud RBAC, service principals"
  cloud_storage: "S3, Azure Blob, GCS, cloud disk, cloud file shares"
  hybrid_connectivity: "Site-to-cloud VPN, ExpressRoute, Direct Connect, hybrid DNS"

  # Monitoring & Observability
  performance: "CPU, memory, disk, bandwidth utilization, latency metrics, capacity"
  status_health: "Device reachability, uptime, ping, operational state, health checks"
  snmp: "SNMP polling, traps, MIBs, OIDs, SNMP v2c/v3, SNMP walk"
  netflow: "NetFlow, sFlow, IPFIX, flow collection, traffic analysis, top talkers"
  logging: "Syslog, event logs, log aggregation, parsing, forwarding, retention"
  alerting: "SNMP traps, threshold alerts, event correlation, escalation"
  apm: "Application performance monitoring, response times, error rates, tracing"
  network_monitoring: "PRTG, Zabbix, Nagios — device monitoring, service checks"
  capacity_planning: "Trend analysis, growth projection, resource forecasting"

  # Identity & Access Management
  users_groups: "Local users, AD/LDAP groups, organizational units, account lifecycle"
  active_directory: "Domain controllers, replication, GPOs, AD sites, trusts, FSMO roles"
  pam: "Privileged access management, credential vaults, session recording"
  secrets_management: "HashiCorp Vault, Azure Key Vault, API keys, secrets rotation"
  rbac: "Role-based access control, permission sets, role assignments, least privilege"

  # Licensing & Compliance
  licensing: "License keys, entitlements, feature activation, usage tracking"
  compliance_audit: "CIS benchmarks, PCI-DSS, SOC2, audit trails, policy enforcement"
  asset_management: "Hardware/software inventory, serial numbers, warranty, EOL/EOS"

  # Configuration & Lifecycle
  config_management: "Running/startup configs, backup, diff, templates, rollback"
  firmware_updates: "OS upgrades, patch management, image management, upgrade paths"
  provisioning: "ZTP, device onboarding, templates, bulk deployment, auto-provisioning"
  automation: "Ansible, Terraform, Python scripts, REST APIs, workflow automation, IaC"
  change_management: "Change tickets, maintenance windows, approval workflows"

  # Load Balancing & Application Delivery
  load_balancing: "Virtual servers, pools, health monitors, traffic distribution"
  global_load_balancing: "GSLB, DNS-based load balancing, geo-routing, site failover"
  ssl_offloading: "SSL/TLS termination, certificate management on LB, cipher suites"
  reverse_proxy: "Nginx, HAProxy, Traefik, Envoy, ingress controllers, backend routing"

  # Telephony & Collaboration
  voip: "SIP trunks, call routing, voice gateways, voice quality, codecs, dial plans"
  video_conferencing: "Meeting room systems, Zoom Rooms, Teams Rooms, SIP endpoints"
  unified_comms: "Cisco UCM, MS Teams telephony, presence, IM, contact center"

  # Email & Messaging
  email_infrastructure: "Exchange, mail flow, connectors, transport rules, mail queues"
  email_deliverability: "MX records, SPF/DKIM/DMARC, relay, bounce management"

  # Database
  database: "SQL Server, Oracle, MySQL, PostgreSQL — instance management, queries"
  database_ha: "Always On, RAC, replication, clustering, failover groups, read replicas"
  database_backup: "Database backup/restore, point-in-time recovery, log shipping"
  database_performance: "Slow queries, index management, execution plans, deadlocks"

  # Endpoint & Client Management
  desktop_management: "SCCM/Intune, GPO deployment, software distribution, OS imaging"
  mdm: "Mobile device management, enrollment, app management, compliance, remote wipe"
  printing: "Print servers, printer management, print queues, driver management"

  # Physical Infrastructure & Data Center
  power_ups: "UPS status, PDU management, power load, battery health, generator"
  environmental: "Temperature, humidity, CRAC/CRAH, hot/cold aisle, cooling"
  physical_cabling: "Patch panels, cable management, fiber/copper, port mapping"
  rack_space: "Rack units, rack layout, physical placement, U-space management"
  physical_security: "Badge access, cameras/CCTV, door controllers, security zones"

  # ITSM & Operations
  ticketing: "Incident management, service requests, ticket lifecycle, SLA tracking"
  cmdb: "Configuration management database, CI relationships, service topology"
  documentation: "Network diagrams, runbooks, SOPs, knowledge base, topology maps"
  change_control: "Change advisory board, change records, risk assessment"

  # IoT & OT
  iot: "IoT device management, IoT gateways, sensor networks, firmware OTA"
  ot_scada: "SCADA, PLC, industrial control systems, OT network segmentation"


