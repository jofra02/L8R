# MCP Server Configuration
# Each server defines a transport (sse or stdio) and connection params.
# Optional fields: vendor, timeout (per-server override of MCP_SERVER_TIMEOUT)
#
# ${VAR} / ${VAR:-default} placeholders are expanded from the environment.
# See servers.example.yaml for more examples.

servers:
  mcp-gateway:
    transport: sse
    url: ${MCP_GATEWAY_URL:-http://localhost:8001/sse}
