[project]
name = "support-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "bcrypt>=4.2.0",
    "fastapi>=0.129.0",
    "langchain>=1.2.10",
    "mcp>=1.0.0",
    "langchain-openai>=1.1.9",
    "langfuse>=2.50.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.0",
    "PyJWT>=2.9.0",
    "python-dotenv>=1.2.1",
    "fastembed>=0.6.1",
    "httpx>=0.27",
    "qdrant-client==1.14.3",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.46",
    "streamlit>=1.54.0",
    "uvicorn>=0.40.0",
    "gunicorn>=23.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# Only self-contained tests; the other src/testing/*.py are integration
# scripts that need live Qdrant/LLM services (run them as python -m modules).
testpaths = [
    "src/testing/test_inventory_gateway_sync.py",
    "src/testing/test_notifications.py",
    "src/testing/test_tenant_header_injection.py",
    "src/testing/test_mcp_executor.py",
    "src/testing/test_assessment_definitions.py",
    "src/testing/test_assessment_scoring.py",
    "src/testing/test_assessment_state_machine.py",
    "src/testing/test_assessment_evaluation.py",
    "src/testing/test_assessment_collector.py",
    "src/testing/test_assessment_api.py",
    "src/testing/test_api_key_scope.py",
]
